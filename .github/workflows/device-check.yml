name: Проверка на эмуляторах

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: android7-malenkiy
            api: 24
            profile: Nexus 5
          - name: android10-sredniy
            api: 29
            profile: pixel_3a
          - name: android14-bolshoy
            api: 34
            profile: pixel_6
          - name: android15-ochen-malenkiy
            api: 35
            profile: Nexus One
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get install -y -qq poppler-utils >/dev/null || true

      - name: Сборка
        run: ./gradlew --no-daemon assembleDebug assembleRelease -PdebugSignRelease

      - name: Проверка в эмуляторе
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: |
            bash .github/device-check.sh ${{ matrix.name }}-debug ; echo $? > device-check/debug-exit
            bash .github/device-check.sh ${{ matrix.name }}-release app/build/outputs/apk/release/app-release.apk ; echo $? > device-check/release-exit

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-check-${{ matrix.name }}
          path: device-check/

      - name: Сохранить результаты в ветку checks/${{ matrix.name }}
        if: always()
        run: |
          cd device-check
          git init -q -b out
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Проверка ${{ matrix.name }} для ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" out:checks/${{ matrix.name }}

      - name: Итог
        run: test "$(cat device-check/debug-exit)" = 0 && test "$(cat device-check/release-exit)" = 0
